services:
  spunto-lite:
    build: .
    container_name: spunto-lite
    restart: unless-stopped
    ports:
      # Port 80 gives clean worker URLs (http://worker-<id>.localhost) with no :port.
      - "80:80"
      # HTTPS for the local wildcard domain (see docs/local-domain.md). Harmless when
      # no cert is present: the server just doesn't listen on it.
      - "443:443"
    networks:
      default:
        # Fixed so the CoreDNS zone below can point `*.local.spunto.net` at it. Same
        # trick as spunto, which pins Traefik at 172.31.0.10.
        ipv4_address: 10.79.0.10
    volumes:
      # Talk to the host Docker daemon — workers are sibling containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the user's SSH keys read-only; injected into workers for git push.
      - ${HOME}/.ssh:/host-ssh:ro
      # Persist the SQLite DB.
      - spunto-lite-data:/app/data
      # mkcert wildcard cert for the local domain — generated by
      # `local-https/generate-certs.sh`, gitignored. Absent = plain HTTP only.
      - ./local-https/certs:/certs:ro
    environment:
      # Two suffixes, because two audiences reach this stack by different names:
      # the host browser over `*.localhost` (resolved to 127.0.0.1 by the browser
      # itself), containers over `*.local.spunto.net` (resolved by the coredns
      # service below). The proxy accepts both — see lib/env.ts.
      BASE_DOMAIN: localhost,local.spunto.net
      TLS_CERT_FILE: /certs/local.spunto.net.pem
      TLS_KEY_FILE: /certs/local.spunto.net-key.pem
      DATA_DIR: /app/data
      HOST_SSH_DIR: /host-ssh
      PORT: 80
      # Set a strong value to protect stored secrets. Defaults to an insecure dev key.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-spunto-lite-dev-insecure-key}
      # Optional headless/CI fallback for private GCP Artifact Registry / GCR base
      # images. Prefer configuring this in the UI (Settings → Container registry),
      # which stores it encrypted in the DB; the UI value wins over this env var.
      GCP_SA_KEY: ${GCP_SA_KEY:-}
      # Optional: search and install VS Code extensions from a custom gallery
      # instead of Open VSX. Same JSON code-server takes; switches the extension
      # picker, the image build and every worker's code-server together. Put the
      # value in `.env` (gitignored) — see `.env.example`.
      EXTENSIONS_GALLERY: ${EXTENSIONS_GALLERY:-}

  # Navigateur pilotable pour tester l'UI de bout en bout (humain ou agent
  # Claude via le serveur MCP `mcp/server.js`, voir `.mcp.json` + `mcp/README.md`).
  # Sur le réseau compose par défaut : il atteint l'app à `http://spunto-lite`.
  # Lancé À LA DEMANDE (image ~1,4 Go, pas au boot) via le profil `browser` :
  #   docker compose --profile browser up -d --build
  # Wildcard DNS local pour `*.local.spunto.net`, porté de spunto (`local-https/`).
  # Il n'existe que pour les conteneurs : `localhost` n'est pas résolvable depuis
  # `browser-remote` (c'est lui-même), et le DNS public de `local.spunto.net` pointe
  # sur la prod. Voir docs/local-domain.md.
  coredns:
    image: coredns/coredns:1.11.3
    restart: unless-stopped
    profiles:
      - browser
      - test
    command: ["-conf", "/etc/coredns/Corefile"]
    networks:
      default:
        ipv4_address: 10.79.0.11
    volumes:
      - ./local-https/Corefile:/etc/coredns/Corefile:ro

  browser-remote:
    image: ghcr.io/spuntodotnet/browser-remote:latest
    restart: unless-stopped
    profiles:
      - browser
      - test
    depends_on:
      - coredns
    ports:
      # Publié pour que le serveur MCP (côté hôte/worker) l'atteigne en localhost.
      - "3005:3000"
    # Résout `*.local.spunto.net` vers le conteneur spunto-lite. Le Corefile relaie
    # tout le reste au resolver Docker, donc `http://spunto-lite` continue de marcher.
    dns:
      - 10.79.0.11
    volumes:
      # rootCA mkcert : l'entrypoint de browser-remote l'importe dans le store système
      # ET dans le store NSS de Chromium, ce qui rend `https://*.local.spunto.net`
      # valide sans avertissement. No-op si le fichier est absent.
      - ./local-https/certs/rootCA.pem:/certs/extra-ca.pem:ro
    environment:
      ACTIVATE_STEALTH_PLUGIN: "true"

  # E2E runner (Playwright) on the compose network, so both its Node `request` fixture and the
  # CDP-driven browser reach the app at the same URL (http://spunto-lite). Runs the browser
  # suite against browser-remote's shared Chrome over CDP — no bundled Playwright browsers.
  # Launched on demand:  docker compose --profile test run --rm e2e
  # (add `--project=api` / `--project=browser` to scope). Requires the `browser-remote` service,
  # which `--profile test` also brings up.
  e2e:
    image: node:24-bookworm-slim
    profiles:
      - test
    working_dir: /work/e2e
    depends_on:
      - spunto-lite
      - browser-remote
      - coredns
    dns:
      - 10.79.0.11
    volumes:
      - ./:/work
    environment:
      E2E_BASE_URL: http://spunto-lite
      CDP_ENDPOINT: http://browser-remote:3000
      # Le proxy accepte les deux suffixes ; les specs qui forgent un Host de worker
      # prennent le premier. Doit rester aligné sur le service spunto-lite.
      BASE_DOMAIN: localhost,local.spunto.net
      CI: "true"
    # `npm ci` then run the suite. The browser project connects over CDP; the api project is
    # pure HTTP — neither downloads a browser.
    command: sh -c "npm ci && npx playwright test"

volumes:
  spunto-lite-data:

networks:
  # Sous-réseau fixe, requis pour pouvoir épingler l'IP de `spunto-lite` (que le
  # Corefile code en dur) et celle de `coredns` (que les autres services pointent
  # en `dns:`). En 10.x volontairement, hors des pools que Docker s'attribue tout
  # seul (172.17-172.31 et 192.168.x) : les workers que spunto-lite crée y piochent
  # leurs propres réseaux, et une collision de sous-réseau les empêcherait de démarrer.
  default:
    ipam:
      config:
        - subnet: 10.79.0.0/24
